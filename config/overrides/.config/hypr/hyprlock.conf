general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $HOME/.config/ml4w/wallpapers/workstation.jpg
    color = rgba(161821ff)
    blur_passes = 1
    blur_size = 3
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffffff)
    font_size = 68
    font_family = Fira Sans
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(ddddddff)
    font_size = 18
    font_family = Fira Sans
    position = 0, 25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 52
    position = 0, -65
    halign = center
    valign = center
    inner_color = rgba(20232add)
    outer_color = rgba(ffffff55)
    font_color = rgba(ffffffff)
    check_color = rgba(89b4faff)
    fail_color = rgba(f38ba8ff)
    outline_thickness = 2
    rounding = 12
    dots_size = 0.25
    dots_center = true
    fade_on_empty = false
    placeholder_text = Enter password...
    font_family = Fira Sans
}
